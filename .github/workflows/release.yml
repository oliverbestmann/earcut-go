name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          # full history and tags, to find the previous tag
          fetch-depth: 0

      - name: Write changelog
        run: |
          # previous version tag reachable from this one, empty for the first release
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME

          {
            echo "## Changes"
            echo
            git log --no-merges --reverse --format='- %s (%h)' "$range"

            if [ -n "$previous" ]; then
              echo
              echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > changelog.md

          cat changelog.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file changelog.md
